      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare artifacts
        if: success()
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ConcoursPilot-V0.2-debug.apk
          zip -qr release/ConcoursPilot-V0.2-source.zip \
            app build.gradle.kts settings.gradle.kts gradle.properties
          sha256sum release/ConcoursPilot-V0.2-debug.apk > release/SHA256.txt
          ls -lh release

      - name: Upload APK and generated source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ConcoursPilot-V0.2
          path: release/
          if-no-files-found: error
          retention-days: 30
