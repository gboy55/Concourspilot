      - name: Verify stable OAuth signing SHA1
        shell: bash
        run: |
          EXPECTED="D6:6F:96:92:DC:8C:F5:8A:79:7C:8C:07:94:68:75:22:8D:10:6A:CB"
          ACTUAL=$(keytool -list -v -keystore concourspilot-dev.jks -storepass concourspilot -alias concourspilot 2>/dev/null | sed -n "s/.*SHA1: //p" | head -n1)
          echo "Package: com.concourspilot.app"
          echo "Signing SHA1: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare artifacts
        if: success()
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ConcoursPilot-V0.4-debug.apk
          cp OAUTH_SETUP.txt release/OAUTH_SETUP.txt
          printf "%s\n" "D6:6F:96:92:DC:8C:F5:8A:79:7C:8C:07:94:68:75:22:8D:10:6A:CB" > release/SIGNING_SHA1.txt
          zip -qr release/ConcoursPilot-V0.4-source.zip \
            app build.gradle.kts settings.gradle.kts gradle.properties concourspilot-dev.jks OAUTH_SETUP.txt
          sha256sum release/ConcoursPilot-V0.4-debug.apk > release/SHA256.txt
          ls -lh release

      - name: Upload APK and generated source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ConcoursPilot-V0.4
          path: release/
          if-no-files-found: error
          retention-days: 30
